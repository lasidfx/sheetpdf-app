name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: SheetPDF-windows
          - os: macos-latest
            name: SheetPDF-mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --name ${{ matrix.name }} --collect-all yt_dlp --collect-submodules googleapiclient --collect-data googleapiclient main.py
      - name: package mac (keep executable bit)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k SheetPDF-mac SheetPDF-mac.zip && rm SheetPDF-mac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 최신 빌드
          make_latest: true
          files: out/*
